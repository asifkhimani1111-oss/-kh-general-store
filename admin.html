<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K.H GENERAL STORE - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f2;font-family:Arial,sans-serif;color:#222}
header{background:#087443;color:white;padding:18px;text-align:center}
main{max-width:650px;margin:15px auto;padding:12px}
.box{background:white;padding:16px;margin-bottom:15px;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{background:#087443;color:white;border:0;font-weight:bold}
.danger{background:#c62828}
img{max-width:100%;max-height:180px;object-fit:contain}
.item{border-bottom:1px solid #eee;padding:12px 0}
.small{font-size:13px;color:#666}
.hidden{display:none}
</style>
</head>
<body>
<header>
<h2>🛒 K.H GENERAL STORE</h2>
<p>Admin Panel</p>
</header>

<main>
<section class="box" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg"></p>
</section>

<div id="panel" class="hidden">

<section class="box">
<h3>🏪 દુકાનની માહિતી</h3>
<input id="storeName" value="K.H GENERAL STORE" placeholder="દુકાનનું નામ">
<label>દુકાનનો ફોટો પસંદ કરો</label>
<input id="storePhoto" type="file" accept="image/*">
<img id="storePreview" alt="">
<button id="saveStore">દુકાનની માહિતી સેવ કરો</button>
</section>

<section class="box">
<h3>➕ નવી પ્રોડક્ટ ઉમેરો</h3>
<input id="pname" placeholder="પ્રોડક્ટનું નામ">
<select id="category">
<option value="ફળો">ફળો</option>
<option value="શાકભાજી">શાકભાજી</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="તેલ">તેલ</option>
<option value="સાબુ">સાબુ</option>
<option value="અન્ય">અન્ય</option>
</select>
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ">
<select id="unit">
<option value="kg">કિલો (kg)</option>
<option value="નંગ">નંગ</option>
<option value="પેકેટ">પેકેટ</option>
<option value="લિટર">લિટર</option>
<option value="બોટલ">બોટલ</option>
<option value="ગ્રામ">ગ્રામ</option>
</select>
<label>પ્રોડક્ટનો ફોટો પસંદ કરો</label>
<input id="productPhoto" type="file" accept="image/*">
<img id="productPreview" alt="">
<button id="saveProduct">પ્રોડક્ટ સેવ કરો</button>
<p id="productMsg"></p>
</section>

<section class="box">
<h3>📦 તમારી પ્રોડક્ટ્સ</h3>
<div id="productList">લોડ થઈ રહ્યું છે...</div>
</section>

<button id="logoutBtn" class="danger">Logout</button>
</div>
</main>

<script type="module">
import {auth,db} from "./firebase.js";

import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
 collection,getDocs,doc,getDoc,setDoc,
 addDoc,deleteDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const ADMIN_UID="4Eg2Ir02WJNKxufdwoGn9GrcjGK2";

const $=id=>document.getElementById(id);
let selectedStorePhoto="";
let selectedProductPhoto="";
let editingId=null;
let allProducts=[];

async function compressImage(file){
 return new Promise((resolve,reject)=>{
 const reader=new FileReader();
 reader.onload=()=>{
 const img=new Image();
 img.onload=()=>{
 const canvas=document.createElement("canvas");
 const scale=Math.min(700/img.width,700/img.height,1);
 canvas.width=Math.round(img.width*scale);
 canvas.height=Math.round(img.height*scale);
 const ctx=canvas.getContext("2d");
 ctx.drawImage(img,0,0,canvas.width,canvas.height);
 let quality=.7;
 let result=canvas.toDataURL("image/jpeg",quality);
 while(result.length>200000&&quality>.25){
 quality-=.1;
 result=canvas.toDataURL("image/jpeg",quality);
 }
 if(result.length>200000){
 reject(new Error("ફોટો મોટો છે. નાનો ફોટો પસંદ કરો."));
 }else resolve(result);
 };
 img.onerror=()=>reject(new Error("ફોટો ખોલી શકાયો નથી."));
 img.src=reader.result;
 };
 reader.onerror=()=>reject(new Error("ફોટો વાંચી શકાયો નથી."));
 reader.readAsDataURL(file);
 });
}

function showPanel(){
 $("loginBox").classList.add("hidden");
 $("panel").classList.remove("hidden");
 loadStore();
 loadProducts();
}

onAuthStateChanged(auth,user=>{
 if(user&&user.uid===ADMIN_UID){
 showPanel();
 }else{
 $("loginBox").classList.remove("hidden");
 $("panel").classList.add("hidden");
 if(user)signOut(auth);
 }
});

$("loginBtn").onclick=async()=>{
 $("loginMsg").textContent="Login થઈ રહ્યું છે...";
 try{
 const result=await signInWithEmailAndPassword(
 auth,$("email").value.trim(),$("password").value
 );
 if(result.user.uid!==ADMIN_UID){
 await signOut(auth);
 throw new Error("આ Admin Account નથી.");
 }
 showPanel();
 }catch(e){
 $("loginMsg").textContent="Login ભૂલ: "+e.message;
 }
};

$("storePhoto").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
 selectedStorePhoto=await compressImage(file);
 $("storePreview").src=selectedStorePhoto;
 }catch(err){alert(err.message)}
};

$("productPhoto").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;
 try{
 selectedProductPhoto=await compressImage(file);
 $("productPreview").src=selectedProductPhoto;
 }catch(err){alert(err.message)}
};

async function loadStore(){
 try{
 const snap=await getDoc(doc(db,"settings","store"));
 if(snap.exists()){
 const data=snap.data();
 $("storeName").value=data.name||"K.H GENERAL STORE";
 selectedStorePhoto=data.photo||"";
 if(selectedStorePhoto)$("storePreview").src=selectedStorePhoto;
 }
 }catch(e){alert("દુકાનની માહિતી લોડ થઈ નથી: "+e.message)}
}

$("saveStore").onclick=async()=>{
 try{
 await setDoc(doc(db,"settings","store"),{
 name:$("storeName").value.trim()||"K.H GENERAL STORE",
 photo:selectedStorePhoto
 },{merge:true});
 alert("દુકાનની માહિતી સેવ થઈ ગઈ.");
 }catch(e){alert("સેવ કરવામાં ભૂલ: "+e.message)}
};

async function loadProducts(){
 try{
 const snap=await getDocs(collection(db,"products"));
 allProducts=snap.docs.map(d=>({id:d.id,...d.data()}));
 renderList();
 }catch(e){
 $("productList").textContent="પ્રોડક્ટ લોડ થઈ નથી: "+e.message;
 }
}

function renderList(){
 if(!allProducts.length){
 $("productList").innerHTML="હજુ કોઈ પ્રોડક્ટ ઉમેરેલી નથી.";
 return;
 }
 $("productList").innerHTML=allProducts.map(p=>`
 <div class="item">
 <b>${escapeText(p.name)}</b><br>
 ₹${Number(p.price).toFixed(2)} / ${escapeText(p.unit||"નંગ")}
 <br><span class="small">${escapeText(p.category||"")}</span>
 <button data-edit="${p.id}">Edit</button>
 <button class="danger" data-delete="${p.id}">Delete</button>
 </div>
 `).join("");
}

function escapeText(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

$("productList").onclick=async e=>{
 const edit=e.target.dataset.edit;
 const del=e.target.dataset.delete;

 if(edit){
 const p=allProducts.find(x=>x.id===edit);
 if(!p)return;
 editingId=p.id;
 $("pname").value=p.name||"";
 $("category").value=p.category||"અન્ય";
 $("price").value=p.price||"";
 $("unit").value=p.unit||"નંગ";
 selectedProductPhoto=p.photo||"";
 $("productPreview").src=selectedProductPhoto;
 $("saveProduct").textContent="ફેરફાર સેવ કરો";
 window.scrollTo(0,0);
 }

 if(del){
 if(!confirm("આ પ્રોડક્ટ ડિલીટ કરવી છે?"))return;
 try{
 await deleteDoc(doc(db,"products",del));
 await loadProducts();
 }catch(err){alert("ડિલીટ થઈ નથી: "+err.message)}
 }
};

$("saveProduct").onclick=async()=>{
 const name=$("pname").value.trim();
 const price=Number($("price").value);

 if(!name||!Number.isFinite(price)||price<=0){
 alert("પ્રોડક્ટનું નામ અને સાચો ભાવ લખો.");
 return;
 }

 const data={
 name,
 category:$("category").value,
 price,
 unit:$("unit").value,
 photo:selectedProductPhoto,
 active:true
 };

 try{
 if(editingId){
 await setDoc(doc(db,"products",editingId),data,{merge:true});
 }else{
 await addDoc(collection(db,"products"),data);
 }

 editingId=null;
 $("pname").value="";
 $("price").value="";
 $("productPhoto").value="";
 $("productPreview").src="";
 selectedProductPhoto="";
 $("saveProduct").textContent="પ્રોડક્ટ સેવ કરો";
 $("productMsg").textContent="પ્રોડક્ટ સેવ થઈ ગઈ.";
 await loadProducts();
 }catch(e){
 $("productMsg").textContent="સેવ કરવામાં ભૂલ: "+e.message;
 }
};

$("logoutBtn").onclick=()=>signOut(auth);
</script>
</body>
</html>
