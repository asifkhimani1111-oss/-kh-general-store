
<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087443">
<title>K.H GENERAL STORE - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f2;font-family:Arial,sans-serif;color:#222}
header{background:#087443;color:white;padding:18px;text-align:center}
main{max-width:650px;margin:15px auto;padding:12px}
.box{background:white;padding:16px;margin-bottom:15px;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{background:#087443;color:white;border:0;font-weight:bold}
.danger{background:#c62828}
.gray{background:#586575}
img.preview{width:100%;max-height:180px;object-fit:contain;background:#eee}
.item{border-bottom:1px solid #eee;padding:12px 0}
.item img{width:90px;height:90px;object-fit:cover;border-radius:8px}
.small{font-size:13px;color:#666}
.hidden{display:none}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
</style>
</head>

<body>

<header>
<h2>🛒 K.H GENERAL STORE</h2>
<p>Admin Panel</p>
</header>

<main>

<section class="box" id="loginBox">
<h3>Admin Login</h3>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Password">
<button id="loginBtn">Login</button>
<p id="loginMsg"></p>
</section>

<div id="panel" class="hidden">

<section class="box">
<h3>🏪 દુકાનની માહિતી</h3>

<label>દુકાનનું નામ</label>
<input id="storeName" placeholder="K.H GENERAL STORE">

<label>📱 દુકાનનો મોબાઇલ / WhatsApp નંબર</label>
<input
 id="storePhone"
 type="tel"
 inputmode="numeric"
 maxlength="13"
 placeholder="ઉદાહરણ: 9876543210"
>

<p class="small">
આ એક જ નંબર દુકાનના મોબાઇલ અને WhatsApp બંને માટે રહેશે.
દેશના કોડ વગર 10 અંકનો નંબર લખો.
</p>

<label>દુકાનનો ફોટો Gallery માંથી પસંદ કરો</label>
<input id="storePhoto" type="file" accept="image/*">

<img id="storePreview" class="preview hidden" alt="દુકાનનો ફોટો">

<button id="saveStore">દુકાનની માહિતી સેવ કરો</button>
<p id="storeMsg"></p>
</section>

<section class="box">

<h3 id="formTitle">➕ નવી પ્રોડક્ટ ઉમેરો</h3>

<label>પ્રોડક્ટનું નામ</label>
<input id="pname" placeholder="પ્રોડક્ટનું નામ">

<label>કેટેગરી</label>
<select id="category">
<option value="ફળો">ફળો</option>
<option value="શાકભાજી">શાકભાજી</option>
<option value="કરિયાણું">કરિયાણું</option>
<option value="તેલ">તેલ</option>
<option value="સાબુ">સાબુ</option>
<option value="અન્ય">અન્ય</option>
</select>

<label>ભાવ</label>
<input id="price" type="number" min="0" step="0.01" placeholder="ભાવ">

<label>પ્રોડક્ટનો યુનિટ</label>
<select id="unit">
<option value="kg">કિલો (kg)</option>
<option value="12 નંગ">12 નંગ (Banana માટે)</option>
<option value="નંગ">નંગ</option>
<option value="પેકેટ">પેકેટ</option>
<option value="લિટર">લિટર</option>
<option value="બોટલ">બોટલ</option>
<option value="ગ્રામ">ગ્રામ</option>
</select>

<label>પ્રોડક્ટનો ફોટો Gallery માંથી પસંદ કરો</label>
<input id="productPhoto" type="file" accept="image/*">

<img id="productPreview" class="preview hidden" alt="પ્રોડક્ટનો ફોટો">

<label>
<input id="active" type="checkbox" checked style="width:auto">
 ગ્રાહકને પ્રોડક્ટ દેખાડો
</label>

<button id="saveProduct">પ્રોડક્ટ સેવ કરો</button>
<button id="cancelEdit" class="gray hidden">Edit બંધ કરો</button>

<p id="productMsg"></p>
</section>

<section class="box">
<h3>📦 તમારી પ્રોડક્ટ્સ</h3>
<div id="productList">લોડ થઈ રહ્યું છે...</div>
</section>

<button id="logoutBtn" class="danger">Logout</button>

</div>
</main>

<script type="module">

import {auth,db} from "./firebase.js";

import {
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
 collection,getDocs,doc,getDoc,setDoc,
 addDoc,deleteDoc,updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const ADMIN_UID="4Eg2Ir02WJNKxufdwoGn9GrcjGK2";

const $=id=>document.getElementById(id);

let editingId=null;
let productPhoto="";
let storePhoto="";

async function compressImage(file){

 return new Promise((resolve,reject)=>{

  const reader=new FileReader();

  reader.onerror=()=>reject(new Error("ફોટો વાંચી શકાયો નથી."));

  reader.onload=()=>{

   const img=new Image();

   img.onerror=()=>reject(new Error("ફોટો ખોલી શકાયો નથી."));

   img.onload=()=>{

    const canvas=document.createElement("canvas");

    const scale=Math.min(
     700/img.width,
     700/img.height,
     1
    );

    canvas.width=Math.round(img.width*scale);
    canvas.height=Math.round(img.height*scale);

    const ctx=canvas.getContext("2d");

    ctx.drawImage(img,0,0,canvas.width,canvas.height);

    let quality=.7;

    let result=canvas.toDataURL("image/jpeg",quality);

    while(result.length>180000 && quality>.3){
     quality-=.08;
     result=canvas.toDataURL("image/jpeg",quality);
    }

    if(result.length>200000){
     reject(new Error("ફોટો મોટો છે. નાનો ફોટો પસંદ કરો."));
    }else{
     resolve(result);
    }
   };

   img.src=reader.result;
  };

  reader.readAsDataURL(file);
 });
}

function normalizeCategory(value){

 const map={
  fruits:"ફળો",
  vegetables:"શાકભાજી",
  groceries:"કરિયાણું",
  oil:"તેલ",
  soap:"સાબુ",
  other:"અન્ય"
 };

 return map[value]||value||"અન્ય";
}

function showPanel(){

 $("loginBox").classList.add("hidden");
 $("panel").classList.remove("hidden");

 loadStore();
 loadProducts();
}

onAuthStateChanged(auth,user=>{

 if(user && user.uid===ADMIN_UID){

  showPanel();

 }else{

  $("loginBox").classList.remove("hidden");
  $("panel").classList.add("hidden");

  if(user){
   $("loginMsg").textContent="આ Admin Account નથી.";
   signOut(auth);
  }
 }
});

$("loginBtn").onclick=async()=>{

 $("loginMsg").textContent="Login થઈ રહ્યું છે...";

 try{

  const result=await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  if(result.user.uid!==ADMIN_UID){

   await signOut(auth);

   throw new Error("આ Admin Account નથી.");
  }

  showPanel();

 }catch(e){

  $("loginMsg").textContent="Login ભૂલ: "+e.message;
 }
};

$("logoutBtn").onclick=()=>signOut(auth);

$("storePhoto").onchange=async e=>{

 const file=e.target.files[0];

 if(!file)return;

 try{

  storePhoto=await compressImage(file);

  $("storePreview").src=storePhoto;
  $("storePreview").classList.remove("hidden");

 }catch(err){

  alert(err.message);
 }
};

$("productPhoto").onchange=async e=>{

 const file=e.target.files[0];

 if(!file)return;

 try{

  $("productMsg").textContent="ફોટો તૈયાર થઈ રહ્યો છે...";

  productPhoto=await compressImage(file);

  $("productPreview").src=productPhoto;
  $("productPreview").classList.remove("hidden");

  $("productMsg").textContent="ફોટો તૈયાર છે.";

 }catch(err){

  $("productMsg").textContent=err.message;
 }
};

async function loadStore(){

 try{

  const snap=await getDoc(doc(db,"settings","store"));

  if(snap.exists()){

   const data=snap.data();

   $("storeName").value=data.name||"K.H GENERAL STORE";

   $("storePhone").value=data.phone||"";

   if(data.photo){

    storePhoto=data.photo;

    $("storePreview").src=data.photo;
    $("storePreview").classList.remove("hidden");
   }

  }else{

   $("storeName").value="K.H GENERAL STORE";
  }

 }catch(e){

  $("storeMsg").textContent=
   "દુકાનની માહિતી લોડ થઈ નથી: "+e.message;
 }
}

$("saveStore").onclick=async()=>{

 const name=$("storeName").value.trim();

 const phone=$("storePhone").value.replace(/\D/g,"");

 if(phone.length!==10){

  $("storeMsg").textContent=
   "યોગ્ય 10 અંકનો મોબાઇલ નંબર લખો.";

  return;
 }

 try{

  $("saveStore").disabled=true;

  $("storeMsg").textContent="સેવ થઈ રહ્યું છે...";

  await setDoc(doc(db,"settings","store"),{

   name:name||"K.H GENERAL STORE",

   phone:phone,

   photo:storePhoto

  },{merge:true});

  $("storeMsg").textContent=
   "દુકાનનું નામ, ફોટો અને WhatsApp નંબર સેવ થઈ ગયા.";

 }catch(e){

  $("storeMsg").textContent=
   "સેવ કરવામાં ભૂલ: "+e.message;

 }finally{

  $("saveStore").disabled=false;
 }
};

async function loadProducts(){

 try{

  const snap=await getDocs(collection(db,"products"));

  const list=$("productList");

  list.innerHTML="";

  if(snap.empty){

   list.textContent="હજુ કોઈ પ્રોડક્ટ ઉમેરેલી નથી.";
   return;
  }

  snap.forEach(d=>{

   const p=d.data();

   const div=document.createElement("div");
   div.className="item";

   const row=document.createElement("div");
   row.className="row";

   if(p.photo){

    const img=document.createElement("img");

    img.src=p.photo;
    img.alt=p.name||"પ્રોડક્ટ";

    row.appendChild(img);
   }

   const info=document.createElement("div");

   const title=document.createElement("b");
   title.textContent=p.name||"નામ નથી";

   const detail=document.createElement("p");

   detail.textContent=
    "₹"+Number(p.price).toFixed(2)+" / "+(p.unit||"નંગ");

   const status=document.createElement("p");
   status.className="small";

   status.textContent=
    p.active===false?"બંધ":"ચાલુ";

   info.append(title,detail,status);

   row.appendChild(info);
   div.appendChild(row);

   const edit=document.createElement("button");

   edit.textContent="Edit";

   edit.onclick=()=>editProduct(d.id,p);

   const del=document.createElement("button");

   del.textContent="Delete";
   del.className="danger";

   del.onclick=()=>removeProduct(d.id);

   div.append(edit,del);

   list.appendChild(div);
  });

 }catch(e){

  $("productList").textContent="લોડ ભૂલ: "+e.message;
 }
}

function editProduct(id,p){

 editingId=id;

 $("formTitle").textContent="પ્રોડક્ટ સુધારો";

 $("pname").value=p.name||"";

 $("category").value=normalizeCategory(p.category);

 $("price").value=p.price||"";

 $("unit").value=p.unit||"નંગ";

 $("active").checked=p.active!==false;

 productPhoto=p.photo||"";

 $("productPhoto").value="";

 if(productPhoto){

  $("productPreview").src=productPhoto;

  $("productPreview").classList.remove("hidden");

 }else{

  $("productPreview").classList.add("hidden");
 }

 $("saveProduct").textContent="ફેરફાર સેવ કરો";

 $("cancelEdit").classList.remove("hidden");

 $("productMsg").textContent="";

 window.scrollTo({top:0,behavior:"smooth"});
}

async function removeProduct(id){

 if(!confirm("આ પ્રોડક્ટ ડિલીટ કરવી છે?"))return;

 try{

  await deleteDoc(doc(db,"products",id));

  await loadProducts();

 }catch(e){

  alert("ડિલીટ ભૂલ: "+e.message);
 }
}

function resetForm(){

 editingId=null;
 productPhoto="";

 $("pname").value="";
 $("price").value="";
 $("productPhoto").value="";

 $("productPreview").src="";
 $("productPreview").classList.add("hidden");

 $("active").checked=true;

 $("category").value="ફળો";
 $("unit").value="kg";

 $("formTitle").textContent="➕ નવી પ્રોડક્ટ ઉમેરો";

 $("saveProduct").textContent="પ્રોડક્ટ સેવ કરો";

 $("cancelEdit").classList.add("hidden");

 $("productMsg").textContent="";
}

$("saveProduct").onclick=async()=>{

 const name=$("pname").value.trim();

 const price=Number($("price").value);

 if(!name||!Number.isFinite(price)||price<=0){

  $("productMsg").textContent=
   "પ્રોડક્ટનું નામ અને યોગ્ય ભાવ લખો.";

  return;
 }

 const data={

  name:name,

  category:$("category").value,

  price:price,

  unit:$("unit").value,

  photo:productPhoto,

  active:$("active").checked
 };

 try{

  $("saveProduct").disabled=true;

  $("productMsg").textContent="સેવ થઈ રહ્યું છે...";

  if(editingId){

   await updateDoc(
    doc(db,"products",editingId),
    data
   );

  }else{

   await addDoc(
    collection(db,"products"),
    data
   );
  }

  resetForm();

  $("productMsg").textContent="પ્રોડક્ટ સેવ થઈ ગઈ.";

  await loadProducts();

 }catch(e){

  $("productMsg").textContent=
   "સેવ કરવામાં ભૂલ: "+e.message;

 }finally{

  $("saveProduct").disabled=false;
 }
};

$("cancelEdit").onclick=resetForm;

</script>
</body>
</html>
